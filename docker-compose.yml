services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sastram
      POSTGRES_PASSWORD: sastram_dev
      POSTGRES_DB: sastram
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sastram"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Unused by the app (limits/quotas read UPSTASH_* only) — kept for
    # contributors who want a local Redis for experimentation. The `app`
    # service does not depend on it and no code connects to it.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["tools"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://sastram:sastram_dev@db:5432/sastram
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public env vars are baked into the client bundle at build time.
        NEXT_PUBLIC_APP_URL: http://localhost:3001
    ports:
      - "3001:3000"
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://sastram:sastram_dev@db:5432/sastram
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_local_placeholder}
      RESEND_FROM: ${RESEND_FROM:-Sastram <noreply@localhost>}
      RESEND_TEMPLATE_OTP: ${RESEND_TEMPLATE_OTP:-local_otp}
      RESEND_TEMPLATE_INVITATION: ${RESEND_TEMPLATE_INVITATION:-local_invitation}
      RESEND_TEMPLATE_THREAD_SUMMARY: ${RESEND_TEMPLATE_THREAD_SUMMARY:-local_thread_summary}
      RESEND_TEMPLATE_PASSWORD_RESET: ${RESEND_TEMPLATE_PASSWORD_RESET:-local_password_reset}
      RESEND_TEMPLATE_WELCOME: ${RESEND_TEMPLATE_WELCOME:-local_welcome}
      # NOTE: no REDIS_URL/REDIS_HOST here on purpose — rate limits, quotas,
      # and caches read UPSTASH_REDIS_REST_URL/TOKEN only (see
      # lib/infrastructure/redis-upstash.ts) and degrade to in-memory without
      # them. Set the UPSTASH pair in .env if you want shared limits locally.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness, not readiness: a database blip must not restart the app.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
