version: "3.9"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sastram
      POSTGRES_PASSWORD: sastram_dev
      POSTGRES_DB: sastram
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sastram"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://sastram:sastram_dev@db:5432/sastram
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_local_placeholder}
      RESEND_FROM: ${RESEND_FROM:-Sastram <noreply@localhost>}
      RESEND_TEMPLATE_OTP: ${RESEND_TEMPLATE_OTP:-local_otp}
      RESEND_TEMPLATE_INVITATION: ${RESEND_TEMPLATE_INVITATION:-local_invitation}
      RESEND_TEMPLATE_THREAD_SUMMARY: ${RESEND_TEMPLATE_THREAD_SUMMARY:-local_thread_summary}
      RESEND_TEMPLATE_PASSWORD_RESET: ${RESEND_TEMPLATE_PASSWORD_RESET:-local_password_reset}
      RESEND_TEMPLATE_WELCOME: ${RESEND_TEMPLATE_WELCOME:-local_welcome}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
