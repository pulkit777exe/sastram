name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Enforcing gate (not bare `bun audit`, which exits 0/1 without policy):
      # fails on new high/critical advisories; documented exceptions with
      # review dates live in scripts/audit-gate.ts.
      - run: bun run audit:gate

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sastram_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run db:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
          BETTER_AUTH_SECRET: ci_secret_that_is_long_enough_32chars
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: ci_cron_secret_long_enough_32chars
          GEMINI_API_KEY: skip
          OPENAI_API_KEY: skip
          REDIS_URL: redis://localhost:6379
          RESEND_API_KEY: re_ci_placeholder_key
          RESEND_FROM: "CI <ci@test.local>"
          RESEND_TEMPLATE_OTP: ci_placeholder
          RESEND_TEMPLATE_INVITATION: ci_placeholder
          RESEND_TEMPLATE_THREAD_SUMMARY: ci_placeholder
          RESEND_TEMPLATE_PASSWORD_RESET: ci_placeholder
          RESEND_TEMPLATE_WELCOME: ci_placeholder
      - run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
          BETTER_AUTH_SECRET: ci_secret_that_is_long_enough_32chars
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: ci_cron_secret_long_enough_32chars
          GEMINI_API_KEY: skip
          OPENAI_API_KEY: skip
          REDIS_URL: redis://localhost:6379
          RESEND_API_KEY: re_ci_placeholder_key
          RESEND_FROM: "CI <ci@test.local>"
          RESEND_TEMPLATE_OTP: ci_placeholder
          RESEND_TEMPLATE_INVITATION: ci_placeholder
          RESEND_TEMPLATE_THREAD_SUMMARY: ci_placeholder
          RESEND_TEMPLATE_PASSWORD_RESET: ci_placeholder
          RESEND_TEMPLATE_WELCOME: ci_placeholder

