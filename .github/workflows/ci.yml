name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `postinstall` runs `prisma generate`, and prisma.config.ts resolves a
      # datasource URL from the environment; generate never connects, so the
      # CI database URL is enough here (no service in this job).
      - run: bun install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
      # Enforcing gate (not bare `bun audit`, which exits 0/1 without policy):
      # fails on new high/critical advisories; documented exceptions with
      # review dates live in scripts/audit-gate.ts.
      - run: bun run audit:gate

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sastram_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `postinstall` runs `prisma generate`, which loads prisma.config.ts and
      # resolves the datasource URL; provide it before the service is used.
      - run: bun install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
      - run: bun run db:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
      # pg_trgm GIN indexes are plain SQL outside migration history; replaying
      # them here keeps CI's schema in parity with the documented deploy flow.
      - run: bun run db:extensions
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/sastram_test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
          BETTER_AUTH_SECRET: ci_secret_that_is_long_enough_32chars
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: ci_cron_secret_long_enough_32chars
          GEMINI_API_KEY: skip
          OPENAI_API_KEY: skip
          RESEND_API_KEY: re_ci_placeholder_key
          RESEND_FROM: "CI <ci@test.local>"
          RESEND_TEMPLATE_OTP: ci_placeholder
          RESEND_TEMPLATE_INVITATION: ci_placeholder
          RESEND_TEMPLATE_THREAD_SUMMARY: ci_placeholder
          RESEND_TEMPLATE_PASSWORD_RESET: ci_placeholder
          RESEND_TEMPLATE_WELCOME: ci_placeholder
      - run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
          BETTER_AUTH_SECRET: ci_secret_that_is_long_enough_32chars
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: ci_cron_secret_long_enough_32chars
          GEMINI_API_KEY: skip
          OPENAI_API_KEY: skip
          RESEND_API_KEY: re_ci_placeholder_key
          RESEND_FROM: "CI <ci@test.local>"
          RESEND_TEMPLATE_OTP: ci_placeholder
          RESEND_TEMPLATE_INVITATION: ci_placeholder
          RESEND_TEMPLATE_THREAD_SUMMARY: ci_placeholder
          RESEND_TEMPLATE_PASSWORD_RESET: ci_placeholder
          RESEND_TEMPLATE_WELCOME: ci_placeholder
      # Exercise the production-only rules (HTTPS, CRON_SECRET, paired
      # integrations, direct migration URL) that dev/test envs don't hit.
      - name: Production readiness configuration
        run: NODE_ENV=production bun run check:prod
        env:
          DATABASE_URL: "postgresql://user:pass@ep-example-pooler.us-east-2.aws.neon.tech/sastram?sslmode=require&pgbouncer=true"
          DATABASE_URL_UNPOOLED: "postgresql://user:pass@ep-example.us-east-2.aws.neon.tech/sastram?sslmode=require"
          BETTER_AUTH_SECRET: ci_secret_that_is_long_enough_32chars
          BETTER_AUTH_URL: https://sastram.example
          NEXT_PUBLIC_APP_URL: https://sastram.example
          CRON_SECRET: ci_cron_secret_long_enough_32chars
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci_placeholder_token
          QSTASH_DEV: 'false'
          GEMINI_API_KEY: skip
          OPENAI_API_KEY: skip
          RESEND_API_KEY: re_ci_placeholder_key
          RESEND_FROM: "CI <ci@test.local>"
          RESEND_TEMPLATE_OTP: ci_placeholder
          RESEND_TEMPLATE_INVITATION: ci_placeholder
          RESEND_TEMPLATE_THREAD_SUMMARY: ci_placeholder
          RESEND_TEMPLATE_PASSWORD_RESET: ci_placeholder
          RESEND_TEMPLATE_WELCOME: ci_placeholder

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sastram_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      # The production image is what actually ships for self-hosted deploys.
      # Build both the migration step and the runtime, then actually boot the
      # standalone server and probe it. A green `docker build` alone cannot
      # catch a broken server.js or missing runtime asset.
      - run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=https://sastram.example
          --target runner
          -t sastram:ci .
        env:
          DOCKER_BUILDKIT: '1'
      - run: docker build --target migrate -t sastram:migrate .
        env:
          DOCKER_BUILDKIT: '1'
      - name: Apply migrations to the CI database
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sastram_test
          -e DATABASE_URL_UNPOOLED=postgresql://postgres:postgres@localhost:5432/sastram_test
          sastram:migrate
      - name: Boot the production image and probe liveness
        run: |
          set -euo pipefail
          docker run -d --name sastram-ci --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sastram_test \
            -e DATABASE_URL_UNPOOLED=postgresql://postgres:postgres@localhost:5432/sastram_test \
            -e BETTER_AUTH_SECRET=ci_secret_that_is_long_enough_32chars \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e NEXT_PUBLIC_APP_URL=https://sastram.example \
            -e CRON_SECRET=ci_cron_secret_long_enough_32chars \
            -e RESEND_API_KEY=re_ci_placeholder_key \
            -e RESEND_FROM="CI <ci@test.local>" \
            -e RESEND_TEMPLATE_OTP=ci_placeholder \
            -e RESEND_TEMPLATE_INVITATION=ci_placeholder \
            -e RESEND_TEMPLATE_THREAD_SUMMARY=ci_placeholder \
            -e RESEND_TEMPLATE_PASSWORD_RESET=ci_placeholder \
            -e RESEND_TEMPLATE_WELCOME=ci_placeholder \
            -e CONTENT_MODERATION_ENABLED=false \
            sastram:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs sastram-ci
          exit 1
      - name: Probe readiness shape (degraded without Redis is expected)
        run: |
          set -euo pipefail
          body="$(curl -sS http://localhost:3000/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"degraded"'
          echo "$body" | grep -q '"redis":"error"'
      - if: always()
        run: docker rm -f sastram-ci || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sastram_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # All values are CI placeholders — no production secrets reach this job.
    # Playwright manages the server itself (E2E_MANAGE_SERVER): the plain
    # `dev` script also boots the local QStash emulator, so CI runs
    # `dev:next`; without QStash credentials jobs run inline.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sastram_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/sastram_test
      BETTER_AUTH_SECRET: ci_secret_that_is_long_enough_32chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci_cron_secret_long_enough_32chars
      GEMINI_API_KEY: skip
      OPENAI_API_KEY: skip
      RESEND_API_KEY: re_ci_placeholder_key
      RESEND_FROM: "CI <ci@test.local>"
      RESEND_TEMPLATE_OTP: ci_placeholder
      RESEND_TEMPLATE_INVITATION: ci_placeholder
      RESEND_TEMPLATE_THREAD_SUMMARY: ci_placeholder
      RESEND_TEMPLATE_PASSWORD_RESET: ci_placeholder
      RESEND_TEMPLATE_WELCOME: ci_placeholder
      E2E_MANAGE_SERVER: 'true'
      E2E_SERVER_COMMAND: bun run dev:next
      E2E_PORT: '3000'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run db:deploy
      # pg_trgm GIN indexes are plain SQL outside migration history; the e2e
      # job replays them so the schema matches the documented deploy flow.
      - run: bun run db:extensions
      - run: bunx playwright install --with-deps chromium
      # global-setup seeds test@sastram.dev + the fixture thread, signs in via
      # the better-auth endpoint and writes test/e2e/.auth/user.json before
      # the specs run against the Playwright-managed dev server.
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
